version: "2"

run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  exclusions:
    rules:
      - linters: [goconst]
        path: examples/

  settings:
    goconst:
      min-occurrences: 5
      ignore-tests: true
    gocyclo:
      min-complexity: 30
