site_name: OpenAI Agents Go SDK
site_description: Community-maintained Go SDK for building AI agents with OpenAI's API
site_url: https://mitulshah1.github.io/openai-agents-go/
repo_name: MitulShah1/openai-agents-go
repo_url: https://github.com/MitulShah1/openai-agents-go

theme:
  name: material
  features:
    # Allows copying code blocks
    - content.code.copy
    # Allows selecting code blocks
    - content.code.select
    # Shows the current path in the sidebar
    - navigation.path
    # Shows sections in the sidebar
    - navigation.sections
    # Shows sections expanded by default
    - navigation.expand
    # Enables annotations in code blocks
    - content.code.annotate
  palette:
    primary: black
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false

markdown_extensions:
  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  # Admonitions (notes, warnings, etc.)
  - admonition
  - pymdownx.details
  # Better lists
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  # Tabs
  - pymdownx.tabbed:
      alternate_style: true
  # Better tables
  - tables
  # Footnotes
  - footnotes
  # Abbreviations
  - abbr
  # Icons and emojis
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Intro: index.md
  - Quickstart: quickstart.md
  - Examples: examples.md
  - Documentation:
      - Agents: agents.md
      - Running Agents: running_agents.md
      - Tracing: tracing.md
      - Tools: tools.md
      - Handoffs: handoffs.md
      - Streaming: streaming.md
      - Structured Outputs: structured_outputs.md
      - Guardrails:
          - Overview: guardrails/index.md
          - Security: guardrails/security.md
          - Moderation: guardrails/moderation.md
          - Content: guardrails/content.md
          - Rate Limiting: guardrails/ratelimit.md
          - Composition: guardrails/composition.md
      - Sessions:
          - Overview: sessions/index.md
  - API Reference:
      - Overview: ref/index.md
      - Guardrails: ref/guardrails/index.md
      - Sessions: ref/sessions/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MitulShah1/openai-agents-go
  generator: false
  version:
    provider: mike
